<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Lista ToDo — LAB B</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="todo.js" defer></script>
</head>
<body>
<main>
    <h1>Lista ToDo — LAB B</h1>

    <div id="todo-app">
        <input id="todo-search" type="search" placeholder="Szukaj..." autocomplete="off">
        <ul id="todo-list"></ul>

        <div id="todo-add">
            <input id="todo-text" type="text" placeholder="do zrobienia..." minlength="3" maxlength="255">
            <input id="todo-date" type="date">
            <button id="todo-save" type="button">Zapisz</button>
        </div>
    </div>
</main>
</body>
</html>
